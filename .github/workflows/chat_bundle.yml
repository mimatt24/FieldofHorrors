name: Build Chat Bundle
on:
  push:
    branches: [ "main", "design/**", "docs/**" ]
    paths:
      - "FieldOfHorrors/docs/**"
      - "FieldOfHorrors/tools/make_chat_bundle.py"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.x" }
      - run: python FieldOfHorrors/tools/make_chat_bundle.py FieldOfHorrors/chat_bundle/bundle_ci.md
      - uses: actions/upload-artifact@v4
        with:
          name: chat-bundle
          path: FieldOfHorrors/chat_bundle/bundle_ci.md
